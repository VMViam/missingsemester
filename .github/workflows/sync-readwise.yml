name: Sync the library from Readwise

on:
  schedule:
    # Every morning, before the day starts
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readwise
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Sync books from Readwise
        env:
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
        run: node scripts/sync-readwise.mjs

      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/books.json
          git diff --cached --quiet || \
            git commit -m "Sync the library from Readwise [$(date +%Y-%m-%d)]"

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin "HEAD:${{ github.ref_name }}"
