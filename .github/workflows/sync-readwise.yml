name: Sync the library from Readwise

on:
  schedule:
    # Every morning, before the day starts
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readwise
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync books from Readwise
        env:
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
        run: node scripts/sync-readwise.mjs

      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/books.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Sync the library from Readwise [$(date +%Y-%m-%d)]"

      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
